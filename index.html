<script>
/* ================== MÓDULO: CONSTANTES ================== */
const PI_=Math.PI, $=id=>document.getElementById(id), RAD=PI_/180, STAGE=2;
const TABS=[[1,'Início e Projeto',1],[2,'Estudos Preliminares',2],[3,'Tráfego',6],[4,'Topografia / MDT',2],

/* ================== MÓDULO: DADOS ================== */
function mkDemo(){const pts=[];let n=1;
 for(let E=900;E<=2500;E+=50)for(let N=900;N<=2600;N+=50){const dv=E-(1550+0.12*(N-900));
  const Z=60+14*Math.sin(E/260)+10*Math.cos(N/210)+0.01*(N-900)-7*Math.exp(-((dv/90)**2));pts.push({id:'P'+n++,E,N,Z:+Z.toFixed(3),d:'TN'})}
 return{demo:true,
 proj:{nome:'RODOVIA EXEMPLO (FICTÍCIA)',codigo:'EX-000',trecho:'Trecho Demonstrativo',mun:'—',uf:'SC',contr:'—',
  projetista:'APavan Engenharia',rt:'',crea:'',art:'',data:'',tipo:'Implantação de rodovia',ext:'',
  src:'Sistema local (topográfico)',datum:'SIRGAS 2000',un:'m',fase:'Estudo preliminar'},
 par:{V:60,emax:0.08,f:0.15,imax:0.07,fonte:'VALORES DE EXEMPLO — conferir no DNIT IPR 706 / órgão contratante',estaca:20,sIni:0},
 pis:[{E:1000,N:1000},{E:1350,N:1420,R:300},{E:1800,N:1500,R:250},{E:2150,N:1950,R:400},{E:2400,N:2500}],
 mdt:{pts,ref:'FICTÍCIA (exemplo)',Lmax:120,ci:2,tol:3},
 feat:[{tipo:'Ponto inicial',pts:[{E:1000,N:1000}]},{tipo:'Ponto final',pts:[{E:2400,N:2500}]},
  {tipo:"Curso d'água",pts:[{E:1550,N:900},{E:1610,N:1400},{E:1670,N:1900},{E:1754,N:2600}]},
  {tipo:'Restrição ambiental (APP/UC)',pts:[{E:1900,N:1050},{E:2300,N:1050},{E:2300,N:1400},{E:1900,N:1400}]}],
 alt:[{nome:'Alternativa A',seg:4,pts:[{E:1000,N:1000},{E:1350,N:1420},{E:1800,N:1500},{E:2150,N:1950},{E:2400,N:2500}]},
  {nome:'Alternativa B',seg:3,pts:[{E:1000,N:1000},{E:1950,N:1200},{E:2250,N:1900},{E:2400,N:2500}]}],intf:[]}}
function mig(o){o.par=o.par||{};if(o.par.imax===undefined)o.par.imax='';
 o.mdt=Object.assign({pts:[],ref:'',Lmax:0,ci:1,tol:2},o.mdt||{});o.feat=o.feat||[];o.alt=o.alt||[];o.intf=o.intf||[];o.pis=o.pis||[];
 o.cmp=Object.assign({custoKm:'',custoTrav:'',fonteC:'',faixa:'',tol:50,esc:'',just:''},o.cmp||{});
 o.cmp.w=Object.assign({L:1,defl:1,desn:1,steep:1,trav:1,restr:1,desap:1,cost:1,seg:1},o.cmp.w||{});
 o.ui=Object.assign({cnt:true,tin:false,pts:true,f7:true,eh:2000,ev:200,ft:"Curso d'água",m2:'',act:0,onlyF:false,pg:0},o.ui||{});return o}
let S=null;try{S=JSON.parse(localStorage.getItem('apavan_estradas')||'null')}catch{}
if(!S)S=mkDemo();
if(S.demo&&!(S.mdt&&S.mdt.pts&&S.mdt.pts.length)){const d=mkDemo();S.mdt=d.mdt;S.feat=d.feat;S.alt=d.alt;S.par.imax=d.par.imax}
mig(S);
let TAB=1,CLICK=false,M=null,FL=new Map(),D2=[];const VB={};
const save=()=>{try{localStorage.setItem('apavan_estradas',JSON.stringify(S))}catch(e){alert('Armazenamento do navegador cheio. Exporte o JSON como backup.')}hdr()};

/* ================== MÓDULO: MOTOR GEOMÉTRICO ================== */
const ENG={
 az(a,b){let t=Math.atan2(b.E-a.E,b.N-a.N);return t<0?t+2*PI_:t},
 dist(a,b){return Math.hypot(b.E-a.E,b.N-a.N)},
 norm(x){while(x>PI_)x-=2*PI_;while(x<=-PI_)x+=2*PI_;return x},
 rmin(p){const V=+p.V,e=+p.emax,f=+p.f;if(!(V>0&&e>=0&&f>0))return null;return V*V/(127*(e+f))},
 build(pis,s0){
  const err=[];
  if(!pis||pis.length<2)return{err:['Não é possível concluir o cálculo. Dados insuficientes (mínimo 2 pontos).'],cur:[],els:[]};
  for(const p of pis)if(p.E===''||p.N===''||!isFinite(+p.E)||!isFinite(+p.N))return{err:['Coordenadas inválidas ou vazias.'],cur:[],els:[]};
  const n=pis.length,cur=[];
  for(let i=1;i<n-1;i++){
   const p=pis[i],ai=this.az(pis[i-1],p),ao=this.az(p,pis[i+1]),d=this.norm(ao-ai),AC=Math.abs(d),R=+p.R;
   if(AC<1e-9){cur.push(null);continue}
   if(!(R>0)){err.push(`PI${i}: raio não informado.`);cur.push(null);continue}
   if(AC>=PI_-1e-6){err.push(`PI${i}: deflexão ≥ 180°, geometria inválida.`);cur.push(null);continue}
   const T=R*Math.tan(AC/2),D=R*AC,E=R*(1/Math.cos(AC/2)-1),sg=d>0?1:-1;
   cur.push({i,R,AC,T,D,E,sg,ai,ao,lado:sg>0?'Direita':'Esquerda',
    PC:{E:+p.E-T*Math.sin(ai),N:+p.N-T*Math.cos(ai)},PT:{E:+p.E+T*Math.sin(ao),N:+p.N+T*Math.cos(ao)}});
  }
  const Tof=i=>(i>0&&i<n-1&&cur[i-1])?cur[i-1].T:0;
  const els=[];let s=+s0||0,start={E:+pis[0].E,N:+pis[0].N};
  for(let i=1;i<n;i++){
   const Lt=this.dist(pis[i-1],pis[i])-Tof(i-1)-Tof(i);
   if(Lt<-1e-6)err.push(`Tangentes insuficientes entre PI${i-1} e PI${i}: sobreposição de ${(-Lt).toFixed(3)} m.`);
   els.push({t:'T',p0:start,az:this.az(pis[i-1],pis[i]),s0:s,L:Math.max(Lt,0)});s+=Math.max(Lt,0);
   const c=i<n-1?cur[i-1]:null;
   if(c){c.sPC=s;c.sPT=s+c.D;els.push({t:'C',c,s0:s,L:c.D});s+=c.D;start=c.PT}
   else if(i<n-1)start={E:+pis[i].E,N:+pis[i].N};
  }
  return{err,cur:cur.filter(Boolean),els,s0:+s0||0,sF:s};
 },
 at(g,s){
  for(const e of g.els){if(s<=e.s0+e.L+1e-9){const u=Math.max(0,s-e.s0);
   if(e.t==='T')return{E:e.p0.E+u*Math.sin(e.az),N:e.p0.N+u*Math.cos(e.az),az:e.az,k:0,el:'Tangente'};
   const c=e.c,f=u/c.R,ch=2*c.R*Math.sin(f/2),a=c.ai+c.sg*f/2;
   return{E:c.PC.E+ch*Math.sin(a),N:c.PC.N+ch*Math.cos(a),az:((c.ai+c.sg*f)%(2*PI_)+2*PI_)%(2*PI_),k:c.sg/c.R,defl:f/2,el:'Curva PI'+c.i}}}
  return null;
 }
};

/* ================== MÓDULO: GEOMETRIA AUXILIAR ================== */
function segX(a,b,c,d){const r1=b.E-a.E,r2=b.N-a.N,s1=d.E-c.E,s2=d.N-c.N,den=r1*s2-r2*s1;if(Math.abs(den)<1e-12)return null;
 const t=((c.E-a.E)*s2-(c.N-a.N)*s1)/den,u=((c.E-a.E)*r2-(c.N-a.N)*r1)/den;return t>=0&&t<=1&&u>=0&&u<=1?t:null}
function pip(p,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a.N>p.N)!==(b.N>p.N)&&p.E<(b.E-a.E)*(p.N-a.N)/(b.N-a.N)+a.E)c=!c}return c}
function dSeg(p,a,b){const dx=b.E-a.E,dy=b.N-a.N,L2=dx*dx+dy*dy;let t=L2?((p.E-a.E)*dx+(p.N-a.N)*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.E-a.E-t*dx,p.N-a.N-t*dy)}
function distPL(p,P){let m=Infinity;for(let i=1;i<P.length;i++)m=Math.min(m,dSeg(p,P[i-1],P[i]));return m}
function samplePL(P,st){const o=[];let s=0;for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],L=ENG.dist(a,b),n=Math.max(1,Math.ceil(L/st));
 for(let k=(i===1?0:1);k<=n;k++){const t=k/n;o.push({E:+a.E+t*(b.E-a.E),N:+a.N+t*(b.N-a.N),s:s+t*L})}s+=L}return o}

/* ================== MÓDULO: MDT (TIN / INTERPOLAÇÃO / CURVAS) ================== */
function delaunay(P,Lmax){const n=P.length;if(n<3)return[];let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
 for(const p of P){x0=Math.min(x0,+p.E);y0=Math.min(y0,+p.N);x1=Math.max(x1,+p.E);y1=Math.max(y1,+p.N)}
 const V=P.map(p=>[+p.E-x0,+p.N-y0]),dm=Math.max(x1-x0,y1-y0)||1,mx=(x1-x0)/2,my=(y1-y0)/2;
 V.push([mx-20*dm,my-dm],[mx,my+20*dm],[mx+20*dm,my-dm]);
 const cc=(a,b,c)=>{const[ax,ay]=V[a],[bx,by]=V[b],[cx,cy]=V[c],D=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));
  if(Math.abs(D)<1e-12)return{a,b,c,x:0,y:0,r:Infinity};
  const A=ax*ax+ay*ay,B=bx*bx+by*by,C=cx*cx+cy*cy,x=(A*(by-cy)+B*(cy-ay)+C*(ay-by))/D,y=(A*(cx-bx)+B*(ax-cx)+C*(bx-ax))/D;
  return{a,b,c,x,y,r:(ax-x)**2+(ay-y)**2}};
 let T=[cc(n,n+1,n+2)];
 for(let i=0;i<n;i++){const[x,y]=V[i],Ed=new Map(),K=[];
  for(const t of T){if((x-t.x)**2+(y-t.y)**2<t.r){for(const[u,v]of[[t.a,t.b],[t.b,t.c],[t.c,t.a]]){const k=u<v?u+'_'+v:v+'_'+u;Ed.has(k)?Ed.delete(k):Ed.set(k,[u,v])}}else K.push(t)}
  for(const[u,v]of Ed.values())K.push(cc(u,v,i));T=K}
 const L=(a,b)=>Math.hypot(V[a][0]-V[b][0],V[a][1]-V[b][1]);
 return T.filter(t=>t.a<n&&t.b<n&&t.c<n&&isFinite(t.r)).filter(t=>{const ar=Math.abs((V[t.b][0]-V[t.a][0])*(V[t.c][1]-V[t.a][1])-(V[t.c][0]-V[t.a][0])*(V[t.b][1]-V[t.a][1]));
  return ar>1e-9*dm*dm&&(!(Lmax>0)||Math.max(L(t.a,t.b),L(t.b,t.c),L(t.c,t.a))<=Lmax)}).map(t=>[t.a,t.b,t.c])}
function triA(P,[a,b,c]){return Math.abs((P[b].E-P[a].E)*(P[c].N-P[a].N)-(P[c].E-P[a].E)*(P[b].N-P[a].N))/2}
function mkZ(P,T){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const p of P){x0=Math.min(x0,+p.E);y0=Math.min(y0,+p.N);x1=Math.max(x1,+p.E);y1=Math.max(y1,+p.N)}
 const cs=Math.max(Math.sqrt(((x1-x0)*(y1-y0)||1)/Math.max(T.length,1))*2,1e-6),G=new Map();
 T.forEach((t,i)=>{const q=t.map(j=>P[j]),es=q.map(p=>+p.E),ns=q.map(p=>+p.N);
  for(let ix=Math.floor((Math.min(...es)-x0)/cs);ix<=Math.floor((Math.max(...es)-x0)/cs);ix++)for(let iy=Math.floor((Math.min(...ns)-y0)/cs);iy<=Math.floor((Math.max(...ns)-y0)/cs);iy++){const k=ix+','+iy;if(!G.has(k))G.set(k,[]);G.get(k).push(i)}});
 const f=(E,N)=>{const Lc=G.get(Math.floor((E-x0)/cs)+','+Math.floor((N-y0)/cs));if(!Lc)return null;
  for(const i of Lc){const[A,B,C]=T[i].map(j=>P[j]),ae=+A.E,an=+A.N,be=+B.E,bn=+B.N,ce=+C.E,cn=+C.N,d=(bn-cn)*(ae-ce)+(ce-be)*(an-cn);if(!d)continue;
   const l1=((bn-cn)*(E-ce)+(ce-be)*(N-cn))/d,l2=((cn-an)*(E-ce)+(ae-ce)*(N-cn))/d,l3=1-l1-l2;
   if(l1>=-1e-9&&l2>=-1e-9&&l3>=-1e-9)return l1*A.Z+l2*B.Z+l3*C.Z}return null};
 f.bb=[x0,y0,x1,y1];return f}
function contoursOf(P,T,ci){const out=[];if(!(ci>0))return out;
 for(const t of T){const p=t.map(j=>P[j]),zs=p.map(q=>+q.Z);
  for(let k=Math.ceil(Math.min(...zs)/ci);k*ci<=Math.max(...zs);k++){const z=k*ci,s=[];
   for(let e=0;e<3;e++){const A=p[e],B=p[(e+1)%3],za=+A.Z,zb=+B.Z;if((za<z)!==(zb<z)){const u=(z-za)/(zb-za);s.push([+A.E+u*(B.E-A.E),+A.N+u*(B.N-A.N)])}}
   if(s.length===2)out.push({z,s,m:k%5===0})}}return out}
function mdtBuild(){const P=[],seen=new Set();
 for(const p of S.mdt.pts){if(![p.E,p.N,p.Z].every(v=>v!==''&&v!==null&&isFinite(+v)))continue;const k=(+p.E).toFixed(3)+'|'+(+p.N).toFixed(3);if(seen.has(k))continue;seen.add(k);P.push(p)}
 M=null;if(P.length>=3){const T=delaunay(P,+S.mdt.Lmax||0);if(T.length){let zn=Infinity,zx=-Infinity;P.forEach(p=>{zn=Math.min(zn,+p.Z);zx=Math.max(zx,+p.Z)});
  M={P,T,z:mkZ(P,T),zmin:zn,zmax:zx,C:contoursOf(P,T,+S.mdt.ci),A:T.reduce((a,t)=>a+triA(P,t),0)}}}
 mdtCheck()}
function mdtCheck(){FL=new Map();const tol=+S.mdt.tol,seen=new Map();
 S.mdt.pts.forEach(p=>{if(![p.E,p.N,p.Z].every(v=>v!==''&&v!==null&&isFinite(+v))){FL.set(p,'Coordenada inválida');return}
  const k=(+p.E).toFixed(3)+'|'+(+p.N).toFixed(3);if(seen.has(k)){const q=seen.get(k),dz=Math.abs(p.Z-q.Z);FL.set(p,dz>1e-3?`Duplicado de ${q.id} com ΔZ=${dz.toFixed(3)} m`:`Duplicado de ${q.id}`)}else seen.set(k,p)});
 if(M&&tol>0){const nb=M.P.map(()=>new Set());for(const[a,b,c]of M.T){nb[a].add(b).add(c);nb[b].add(a).add(c);nb[c].add(a).add(b)}
  M.P.forEach((p,i)=>{if(!nb[i].size)return;let s=0;nb[i].forEach(j=>s+=+M.P[j].Z);const r=+p.Z-s/nb[i].size;if(Math.abs(r)>tol)FL.set(p,`Z discrepante: ${r.toFixed(2)} m em relação à média dos vizinhos`)})}}

/* ================== MÓDULO: IMPORTAÇÃO ================== */
function parsePts(t,ext,ord){
 if(ext==='xml'||ext==='landxml')return pXML(t);if(ext==='dxf')return pDXF(t);
 const o=ord.split(''),ix=c=>o.indexOf(c),r=[],num=s=>s==null||String(s).trim()===''?NaN:+String(s).trim().replace(',','.');
 t.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l||l[0]==='#')return;let f;
  if(l.includes(';'))f=l.split(';');else if(l.includes('\t'))f=l.split('\t');else if((l.match(/,/g)||[]).length>=2)f=l.split(',');else f=l.split(/\s+/);
  f=f.map(s=>s.trim());const E=num(f[ix('E')]),N=num(f[ix('N')]),Z=num(f[ix('Z')]);if(![E,N,Z].every(isFinite))return;
  r.push({id:ix('P')>=0?f[ix('P')]:'',E,N,Z,d:ix('D')>=0?f.slice(ix('D')).join(' '):''})});return r}
function pXML(t){const d=new DOMParser().parseFromString(t,'application/xml');if(d.getElementsByTagName('parsererror').length)throw Error('XML inválido');const r=[];
 const rd=(e,id)=>{const v=e.textContent.trim().split(/\s+/).map(Number);if(v.length>=3&&v.slice(0,3).every(isFinite))r.push({id:id||'',N:v[0],E:v[1],Z:v[2],d:e.getAttribute('desc')||e.getAttribute('code')||''})};
 [...d.getElementsByTagName('CgPoint')].forEach(e=>rd(e,e.getAttribute('name')));

 const s=new Set();return r.filter(p=>{const k=p.E.toFixed(3)+'|'+p.N.toFixed(3)+'|'+p.Z.toFixed(3);if(s.has(k))return false;s.add(k);return true})}

function bbox(L){let b=[Infinity,Infinity,-Infinity,-Infinity];for(const p of L){if(p.E===''||!isFinite(+p.E)||!isFinite(+p.N))continue;b=[Math.min(b[0],+p.E),Math.min(b[1],+p.N),Math.max(b[2],+p.E),Math.max(b[3],+p.N)]}return b}

 const W=sv.clientWidth||900,H=540,pad=Math.max(x1-x0,y1-y0,100)*.06;x0-=pad;x1+=pad;y0-=pad;y1+=pad;
 const k=Math.min(W/(x1-x0),H/(y1-y0)),ox=(W-(x1-x0)*k)/2,oy=(H-(y1-y0)*k)/2;
 return{W,H,k,X:e=>ox+(e-x0)*k,Y:n=>H-oy-(n-y0)*k,inv:(px,py)=>({E:x0+(px-ox)/k,N:y0+(H-oy-py)/k})}}

 const vb=()=>sv.getAttribute('viewBox').split(' ').map(Number),pt=e=>{const p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(sv.getScreenCTM().inverse())};
 sv.onwheel=e=>{e.preventDefault();const p=pt(e),[x,y,w,h]=vb(),f=e.deltaY>0?1.25:0.8;VB[id]=[p.x-(p.x-x)*f,p.y-(p.y-y)*f,w*f,h*f].join(' ');sv.setAttribute('viewBox',VB[id])};
 let d=null;
 sv.onpointerdown=e=>{d={x:e.clientX,y:e.clientY,v:vb(),m:false,p:pt(e)};sv.setPointerCapture(e.pointerId)};
 sv.onpointermove=e=>{if(!d)return;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>4)d.m=true;
  if(d.m){const r=sv.getBoundingClientRect(),s=Math.max(d.v[2]/r.width,d.v[3]/r.height);VB[id]=[d.v[0]-(e.clientX-d.x)*s,d.v[1]-(e.clientY-d.y)*s,d.v[2],d.v[3]].join(' ');sv.setAttribute('viewBox',VB[id])}};

function altMetrics(a){const P=a.pts;if(P.length<2)return null;const C=S.cmp,r={L:0,defl:0,nPI:P.length-2,trav:0,talv:0,intf:0,inP:{},obr:[],obs:0};
 for(let i=1;i<P.length;i++)r.L+=ENG.dist(P[i-1],P[i]);
 for(let i=1;i<P.length-1;i++)r.defl=Math.max(r.defl,Math.abs(ENG.norm(ENG.az(P[i],P[i+1])-ENG.az(P[i-1],P[i])))/RAD);
 const Q=samplePL(P,10),im=+S.par.imax;
 if(M){const z=Q.map(q=>M.z(q.E,q.N));let up=0,dn=0,st=0,cov=0;
  for(let i=1;i<Q.length;i++)if(z[i]!=null&&z[i-1]!=null){const dz=z[i]-z[i-1],ds=Q[i].s-Q[i-1].s;if(dz>0)up+=dz;else dn-=dz;cov+=ds;if(im>0&&Math.abs(dz/ds)>im)st+=ds}
  r.cov=cov/r.L;r.desn=r.cov>0?up+dn:null;r.steep=im>0&&r.cov>0?st:null}else{r.cov=0;r.desn=null;r.steep=null}
 S.feat.forEach(f=>{const g=FT[f.tipo]?.[0];
  if(g==='ln'){let n=0;for(let i=1;i<P.length;i++)for(let j=1;j<f.pts.length;j++)if(segX(P[i-1],P[i],f.pts[j-1],f.pts[j])!=null)n++;
   if(f.tipo==="Curso d'água")r.trav+=n;else if(f.tipo==='Talvegue')r.talv+=n;else if(f.tipo==='Eixo existente'||f.tipo==='Limite de propriedade')r.intf+=n}
  if(g==='pg'&&f.pts.length>=3)for(let i=1;i<Q.length;i++){const m={E:(Q[i].E+Q[i-1].E)/2,N:(Q[i].N+Q[i-1].N)/2};if(pip(m,f.pts))r.inP[f.tipo]=(r.inP[f.tipo]||0)+Q[i].s-Q[i-1].s}
  if(g==='pt'){const d=distPL(f.pts[0],P);if(f.tipo==='Obstáculo'){if(d<=+C.tol)r.obs++}else r.obr.push({t:f.tipo,d,ok:d<=+C.tol})}});
 r.travT=r.trav+r.talv;r.restr=RESTR.reduce((s,k)=>s+(r.inP[k]||0),0);
 r.desap=+C.faixa>0?(r.inP['Área de desapropriação']||0)*+C.faixa:null;
 r.cost=+C.custoKm>0?r.L/1000*+C.custoKm+r.travT*(+C.custoTrav||0):null;r.seg=+a.seg>0?+a.seg:null;return r}
const CR=[['L','Extensão (m)',-1],['defl','Deflexão máxima entre tangentes (°)',-1],['desn','Desnível acumulado do terreno (m)',-1],
['steep','Extensão c/ declividade natural > rampa de referência (m) — indicador de terraplenagem',-1],['travT','Travessias de cursos d\'água + talvegues (possíveis OAC/OAE)',-1],

function score(R){const I=R.map((r,i)=>r?i:-1).filter(i=>i>=0);if(!I.length)return null;const sc=R.map(()=>null),used=[];let W=0;I.forEach(i=>sc[i]=0);

  const lo=Math.min(...v),hi=Math.max(...v);used.push(k);W+=w;I.forEach((i,j)=>sc[i]+=w*(hi===lo?1:dir<0?(hi-v[j])/(hi-lo):(v[j]-lo)/(hi-lo)))}

function plan(){const sv=$('sv');if(!sv)return;const g=G(),ok=S.pis.filter(p=>p.E!==''&&p.N!==''&&isFinite(+p.E)&&isFinite(+p.N));

 if(ok.length>1)h+=`<polyline points="${ok.map(p=>X(+p.E)+','+Y(+p.N)).join(' ')}" fill="none" stroke="#99a" stroke-dasharray="6 4"/>`;
 if(g.els.length){let pts=[];for(let s=g.s0;s<=g.sF;s+=Math.max(1,(g.sF-g.s0)/1500)){const p=ENG.at(g,s);if(p)pts.push(X(p.E)+','+Y(p.N))}

 ok.forEach(p=>{const i=S.pis.indexOf(p);h+=`<rect x="${X(+p.E)-4}" y="${Y(+p.N)-4}" width="8" height="8" fill="#fff" stroke="#0b1f3a"/><text x="${X(+p.E)+6}" y="${Y(+p.N)+14}" font-size="11" font-weight="600">${i===0?'INÍCIO':i===S.pis.length-1?'FIM':'PI'+i}</text>`});
 h+=`<text x="${F.W-30}" y="25" font-size="14" font-weight="700">N↑</text>`;sv.innerHTML=h;

function stake(g){const E=+S.par.estaca||20,L=new Map();const add=(s,o)=>{const k=s.toFixed(4);L.set(k,(L.get(k)?L.get(k)+' / ':'')+o)};
 add(g.s0,'Início');for(let s=Math.ceil(g.s0/E-1e-9)*E;s<=g.sF+1e-9;s+=E)add(s,'');g.cur.forEach(c=>{add(c.sPC,'PC'+c.i);add(c.sPT,'PT'+c.i)});add(g.sF,'Fim');
 return[...L].map(([k,o])=>[+k,o.replace(/^ \/ /,'')]).sort((a,b)=>a[0]-b[0]).map(([s,o],i,a)=>{const p=ENG.at(g,s);return{s,o,p,d:i?s-a[i-1][0]:0,z:M&&p?M.z(p.E,p.N):null}})}

 S.feat.forEach(f=>{if(FT[f.tipo]?.[0]!=='ln')return;for(let i=1;i<A.length;i++)for(let j=1;j<f.pts.length;j++){const t=segX(A[i-1][1],A[i][1],f.pts[j-1],f.pts[j]);if(t!=null)out.push({s:A[i-1][0]+t*(A[i][0]-A[i-1][0]),tipo:f.tipo,d:'Automático (cruzamento do eixo)'})}});return out.sort((a,b)=>a.s-b.s)}

/* Pontos cotados: usa os MESMOS dados do cálculo (q.D, q.zT, q.z0, q.ze, offsets q.L/q.R) */
function cot12(q,ter){const D=q.D,rk={eixo:3,off:3,plat:2,ter:1},P=[],xl=-q.L.cat,xr=q.R.cat;
 const zP=x=>{for(let i=1;i<D.length;i++){const[a,za]=D[i-1],[b,zb]=D[i];if(x>=Math.min(a,b)-1e-9&&x<=Math.max(a,b)+1e-9)return b===a?zb:za+(zb-za)*(x-a)/(b-a)}return null};
 const add=(x,t)=>{const p=P.find(p=>Math.abs(p.x-x)<1e-3);if(p){if(rk[t]>rk[p.t])p.t=t;return}P.push({x,t})};
 D.forEach(([x])=>add(x,Math.abs(x-xl)<1e-3||Math.abs(x-xr)<1e-3?'off':'plat'));add(xl,'off');add(xr,'off');add(0,'eixo');
 if(ter)for(let x=xl+0.25;x<xr-0.25+1e-9;x+=0.25){const a=q.zT(x-0.25),b=q.zT(x),c=q.zT(x+0.25);
  if(a!=null&&b!=null&&c!=null&&Math.abs(c-2*b+a)>2e-3)add(+x.toFixed(2),'ter')}
 P.sort((a,b)=>a.x-b.x);
 return P.map(p=>{let zp,zt;
  if(p.t==='off'){const o=p.x<0?q.L:q.R;zp=zt=o.pts.at(-1)[1]}
  else if(p.t==='eixo'){zp=q.z0;zt=q.ze}
  else{zp=zP(p.x);zt=q.zT(p.x)}
  const h=zp!=null&&zt!=null?zp-zt:null;
  return{...p,zp,zt,h,tp:h==null?'':Math.abs(h)<5e-4?'—':h>0?'A':'C'}})}

<script>
/* ================== MÓDULO: ABA 23 — PRANCHAS DE SEÇÕES TRANSVERSAIS ================== */
(function(){
const FMT={A1:[841,594],A2:[594,420],A3:[420,297],A4:[297,210]};
const MG=f=>f==='A1'?[25,10]:[25,7]; // [margem esquerda, demais] — conferir NBR 10068
function cfg(){S.prn=Object.assign({fmt:'A3',esc:'200',s0:'',s1:'',cada:1,pg:0,tit:'SEÇÕES TRANSVERSAIS',cot:'Sim'},S.prn||{})
;return S.prn}
function zI(D,x){if(!D.length||x<D[0][0]-1e-9||x>D.at(-1)[0]+1e-9)return null;
 for(let i=1;i<D.length;i++)if(x<=D[i][0]+1e-9){const a=D[i-1],b=D[i],t=b[0]===a[0]?0:(x-a[0])/(b[0]-a[0]);return a[1]+t*(b[1]-a[1])}return D.at(-1)[1]}
function terr(p,x){if(!M)return null;return M.z(p.E+x*Math.cos(p.az),p.N-x*Math.sin(p.az))}
function sign(L){for(const r of L){const d=r.sec.D[0],a=terr(r.sec.p,d[0]),b=terr(r.sec.p,-d[0]);
 if(a!=null&&b!=null)return Math.abs(a-d[1])<=Math.abs(b-d[1])?1:-1}return 1}

function pages(){const c=cfg(),[W,H]=FMT[c.fmt]||FMT.A3,[ml,mo]=MG(c.fmt),k=1000/(+c.esc||200),sh=44;
 let E;try{E=earth()}catch(e){return{err:'Não é possível gerar as seções: '+e.message}}
 let L=(E.R||[]).filter(r=>r.sec&&Array.isArray(r.sec.D)&&r.sec.D.length>1);
 if(c.s0!==''&&isFinite(+c.s0))L=L.filter(r=>r.s>=+c.s0-1e-6);
 if(c.s1!==''&&isFinite(+c.s1))L=L.filter(r=>r.s<=+c.s1+1e-6);
 const n=Math.max(1,+c.cada|0);L=L.filter((r,i)=>i%n===0);
 if(!L.length)return{err:'Nenhuma seção válida no intervalo informado.'};
 if(!M)return{err:'MDT não gerado (Aba 04). Não é possível desenhar o terreno.'};
 const sg=sign(L);
 const Q=L.map(r=>{const D=r.sec.D,xa=D[0][0]-3,xb=D.at(-1)[0]+3,T=[];
  for(let x=xa;x<=xb+1e-9;x+=0.5){const z=terr(r.sec.p,x*sg);if(z!=null)T.push([x,z])}
  const zz=[...D.map(d=>d[1]),...T.map(t=>t[1])];
  return{r,D,T,xa,xb,za:Math.floor(Math.min(...zz))-1,zb:Math.ceil(Math.max(...zz))+1}});
  const cot=c.cot!=='Não';let rot=false;
 if(cot)Q.forEach(q=>{const s=q.r.sec;q.P=(s.err||typeof s.zT!=='function')?[]:cot12(s,false).filter(p=>p.zp!=null);
  q.P.forEach((p,i,a)=>{p.gap=Math.min(i?(p.x-a[i-1].x)*k:1e9,i<a.length-1?(a[i+1].x-p.x)*k:1e9)});
  if(q.P.some(p=>p.gap<8))rot=true});
 const rh=rot?8:4,FB=cot?5+3*rh:0,pl=cot?14:7;
 const xL=Math.max(...Q.map(q=>-q.xa)),xR=Math.max(...Q.map(q=>q.xb));
 const cw=(xL+xR)*k+7+pl,ch=Math.max(...Q.map(q=>q.zb-q.za))*k+16+FB;
 const uw=W-ml-mo,uh=H-2*mo-sh-2,nc=Math.floor(uw/cw),nr=Math.floor(uh/ch);
 if(nc<1||nr<1)return{err:`A seção não cabe na folha ${c.fmt} em 1:${c.esc} (célula ${cw.toFixed(0)} × ${ch.toFixed(0)} mm). Use escala menor ou formato maior.`};
 const per=nc*nr,np=Math.ceil(Q.length/per),ox=ml+(uw-nc*cw)/2,oy=mo+1;
 const A={k,xL,cw,ch,W,H,ml,mo,sh,np,c,cot,rh,FB,pl,s0:Q[0].r.s,s1:Q.at(-1).r.s};
 const svg=i=>{let h=`<rect x="${ml}" y="${mo}" width="${W-ml-mo}" height="${H-2*mo}" fill="none" stroke="#000" stroke-width=".5"/>`;
  Q.slice(i*per,(i+1)*per).forEach((q,j)=>h+=cell(q,ox+(j%nc)*cw,oy+Math.floor(j/nc)*ch,A));
  h+=stamp(A,i)+legend(A);

 const X=x=>(ax+x*k).toFixed(2),Y=z=>(base-(z-q.za)*k).toFixed(2);let h='';
 const zs=nice(5/k);
 for(let z=Math.ceil(q.za/zs)*zs;z<=q.zb+1e-9;z+=zs)
  h+=`<line x1="${X(q.xa)}" x2="${X(q.xb)}" y1="${Y(z)}" y2="${Y(z)}" stroke="#ccc" stroke-width=".1"/><text x="${(+X(q.xa)-.8).toFixed(2)}" y="${(+Y(z)+.7).toFixed(2)}" font-size="2" text-anchor="end">${+z.toFixed(2)}</text>`;
 let pc='',pa='';const x1=q.D[0][0],x2=q.D.at(-1)[0],dx=.25;
 for(let x=x1;x<x2-1e-9;x+=dx){const xb=Math.min(x+dx,x2),d1=zI(q.D,x),d2=zI(q.D,xb),t1=zI(q.T,x),t2=zI(q.T,xb);
  if([d1,d2,t1,t2].some(v=>v==null))continue;const p=`M${X(x)} ${Y(d1)}L${X(xb)} ${Y(d2)}L${X(xb)} ${Y(t2)}L${X(x)} ${Y(t1)}Z`;
  if((t1+t2)/2>(d1+d2)/2)pc+=p;else pa+=p}
 h+=`<path d="${pc}" fill="#e6394655"/><path d="${pa}" fill="#2a9d8f55"/>`;
 h+=`<path d="${q.T.map((t,i)=>(i?'L':'M')+X(t[0])+' '+Y(t[1])).join('')}" fill="none" stroke="#6b4a2b" stroke-width=".25"/>`;
 h+=`<path d="${q.D.map((d,i)=>(i?'L':'M')+X(d[0])+' '+Y(d[1])).join('')}" fill="none" stroke="#0b1f3a" stroke-width=".4"/>`;
 h+=`<line x1="${X(0)}" x2="${X(0)}" y1="${Y(q.zb)}" y2="${base}" stroke="#555" stroke-width=".15" stroke-dasharray="1.5 1"/>`;
 if(!A.cot)[q.D[0],q.D.at(-1)].forEach(d=>h+=`<text x="${X(d[0])}" y="${(+Y(d[1])-1).toFixed(2)}" font-size="1.8" text-anchor="middle">${fx(d[0],2)}</text>`);
 h+=`<text x="${X(0)}" y="${base+3.5}" font-size="2.5" font-weight="700" text-anchor="middle">EST. ${esc(est(r.s))}${r.o?' — '+esc(r.o):''}</text>`;
 h+=`<text x="${X(0)}" y="${base+6.8}" font-size="2" text-anchor="middle">Greide ${fx(s.zg,3)} | Plataforma ${fx(s.z0,3)} | Corte
 ${fx(s.Ac,2)} m² | Aterro ${fx(s.Af,2)} m²</text>`;
 /* ---- Cotas detalhadas (mesma fonte da Aba 12: cot12) ---- */
 if(A.cot&&q.P&&q.P.length){const P=q.P,f=1.6,rh=A.rh,yb=base+8.5,xe=+X(q.xb),xi=Math.max(x0+1,+X(q.xa)-A.pl+1),
hl=' paint-order="stroke" stroke="#fff" stroke-width=".45"';
  const tx=(x,y,t,c,r9,b,sz)=>r9?`<text transform="translate(${(+x).toFixed(2)},${(+y).toFixed(2)}) rotate(-90)" font-size="${sz||f}" fill="${c}" text-anchor="middle" dominant-baseline="middle"${b?' font-weight="700"':''}${hl}>${t}</text>`
   :`<text x="${(+x).toFixed(2)}" y="${(+y+(sz||f)*.35).toFixed(2)}" font-size="${sz||f}" fill="${c}" text-anchor="middle"${b?' font-weight="700"':''}${hl}>${t}</text>`;
  P.forEach(p=>{const xp=+X(p.x),yp=+Y(p.zp),yt=p.zt!=null?+Y(p.zt):yp,yT=Math.min(yp,yt),yB=Math.max(yp,yt);
   h+=`<line x1="${xp}" x2="${xp}" y1="${yT}" y2="${base}" stroke="#8a94a3" stroke-width=".1" stroke-dasharray=".8 .5"/>`;
   if(p.tp==='A'||p.tp==='C'){const c=p.tp==='C'?'#b00020':'#0077b6',t=`h=${fx(Math.abs(p.h))} (${p.tp})`;
    h+=p.gap<8?tx(xp+1.1,(yT+yB)/2,t,c,1,1):`<text x="${(xp+.6).toFixed(2)}" y="${((yT+yB)/2+.5).toFixed(2)}" font-size="${f}" fill="${c}" font-weight="700"${hl}>${t}</text>`}});
  /* Faixa de rodapé: distâncias parciais + Afast./Terreno/Projeto */
  const y0b=yb+4;h+=`<rect x="${xi}" y="${yb}" width="${(xe-xi).toFixed(2)}" height="${(A.FB-1).toFixed(2)}" fill="#fff" stroke="#000" stroke-width=".2"/>`;

  h+=`<line x1="${xi+A.pl-1.5}" x2="${xi+A.pl-1.5}"
 y1="${yb}" y2="${(yb+A.FB-1).toFixed(2)}" stroke="#000" stroke-width=".12"/>`;
  for(let i=1;i<P.length;i++){const a=+X(P[i-1].x),b=+X(P[i].x);if(b-a<.5)continue;
   h+=`<line x1="${a}" x2="${b}" y1="${yb+2.6}" y2="${yb+2.6}" stroke="#000" stroke-width=".1"/>`+[a,b].map(v=>`<line x1="${v-.5}" x2="${v+.5}" y1="${yb+3.1}" y2="${yb+2.1}" stroke="#000" stroke-width=".15"/>`).join('');
   if(b-a>=3.2)h+=`<text x="${((a+b)/2).toFixed(2)}" y="${yb+2}" font-size="${b-a<5?1.1:1.4}"

  P.forEach(p=>{const xp=+X(p.x),r9=p.gap<8;
   h+=`<line x1="${xp}" x2="${xp}" y1="${y0b}" y2="${(yb+A.FB-1).toFixed(2)}" stroke="#c5ccd6" stroke-width=".08"/>`;
   [[fx(p.x,2),'#0b1f3a'],[p.zt!=null?fx(p.zt):'—','#6b4a2b'],[fx(p.zp),'#0b1f3a']].forEach(([t,c],i)=>h+=tx(xp,y0b+i*rh+rh/2,t,c,r9,i!==1))})}
 return h}

function stamp(A,i){const{W,H,mo,c,np,sh}=A,w=Math.min(180,W-A.ml-mo),x=W-mo-w,y=H-mo-sh,P=S.proj,c4=w/4;

 [20,31].forEach(d=>h+=`<line x1="${x}" x2="${x+w}" y1="${y+d}" y2="${y+d}" stroke="#000" stroke-width=".25"/>`);

 h+=t(3*c4+2,35,2,'FOLHA')+t(3*c4+2,40,3,`${String(i+1).padStart(2,'0')}/${String(np).padStart(2,'0')} — ${c.fmt}`,1);
 return h}

 +`<line x1="${x}" x2="${x+8}" y1="${y+9}" y2="${y+9}" stroke="#6b4a2b" stroke-width=".25"/><text x="${x+10}" y="${y+10}" font-size="2.2">Terreno natural (MDT)</text>`

function tab23(){const c=cfg(),P=pages();let pv;
 if(P.err)pv=`<p class="nok">✖ ${P.err}</p>`;

  <div style="background:#888;padding:8px;margin-top:6px">${P.svg(c.pg).replace('<svg ','<svg style="width:100%;height:auto;background:#fff;border:0;cursor:default" ')}</div>`}

 ${fld('prn.cada','Desenhar 1 a cada N seções','number')}${fld('prn.tit','Título do desenho')}${fld('prn.cot','Cotas detalhadas','',['Sim','Não'])}</div>

 <button class="btn c" onclick="p23print()">🖨 Imprimir / PDF (todas)</button>

<script>

(function(){
const FM={A1:[841,594],A2:[594,420],A3:[420,297],A4:[297,210]},MG=f=>f==='A1'?[25,10]:[25,7];
function pc(){S.prn=Object.assign({fmt:'A3',s0:'',s1:'',pg:0,tipo:'sec',eh:'1000',ev:'100',ppT:'PLANTA E PERFIL'},S.prn||{});return S.prn}

function zG(s,V){if(V.length<2||s<V[0].s-1e-6||s>V.at(-1).s+1e-6)return null;const i=k=>(V[k+1].z-V[k].z)/(V[k+1].s-V[k].s);
 for(let k=1;k<V.length-1;k++){const v=V[k];if(v.L>0&&Math.abs(s-v.s)<=v.L/2){const i1=i(k-1),i2=i(k),x=s-(v.s-v.L/2);return v.z+i1*(s-v.s)+(i2-i1)/(2*v.L)*x*x}}
 for(let k=0;k<V.length-1;k++)if(s<=V[k+1].s+1e-9)return V[k].z+i(k)*(s-V[k].s);return null}
function chkG(V){try{const E=earth();let m=null;(E.R||[]).forEach(r=>{const z=zG(r.s,V);if(z!=null&&r.sec&&isFinite(r.sec.zg))m=Math.max(m||0,Math.abs(z-r.sec.zg))});return m}catch(e){return null}}
const T=(x,y,sz,v,o='')=>`<text x="${(+x).toFixed(2)}" y="${(+y).toFixed(2)}" font-size="${sz}" ${o}>${esc(v)}</text>`;

function stamp(W,H,ml,mo,sh,c,i,np,a,b){const w=Math.min(180,W-ml-mo),x=W-mo-w,y=H-mo-sh,P=S.proj,c4=w/4,t=(tx,ty,sz,v,bd)=>T(x+tx,y+ty,sz,v,bd?'font-weight="700"':'');
 let h=`<rect x="${x}" y="${y}" width="${w}" height="${sh}" fill="#fff" stroke="#000" stroke-width=".5"/><rect x="${x}" y="${y}" width="${w}" height="10" fill="#0b1f3a"/>`+T(x+3,y+7,4.5,'APavan','font-weight="700" fill="#fff"')+T(x+27,y+6.8,2.6,'ENGENHARIA E CONSULTORIA','fill="#cfd8e3"');
 [20,31].forEach(d=>h+=`<line x1="${x}" x2="${x+w}" y1="${y+d}" y2="${y+d}" stroke="#000" stroke-width=".25"/>`);

   const path=(D,col,w)=>{let d='',pen=false;D.forEach(([s,z])=>{if(z==null){pen=false;return}d+=(pen?'L':'M')+X(s).toFixed(2)+' '+Y(z).toFixed(2);pen=true});return`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}"/>`};

    +T(X(v.s)+.8,py0+6,1.7,`PIV ${est(v.s)} | ${fx(v.z,3)}${v.L?' | L='+v.L:''}`,'fill="#e63946"')});
   for(let k=0;k<V.length-1;k++){const sm=(V[k].s+V[k+1].s)/2;if(sm<a||sm>b)continue;const ii=(V[k+1].z-V[k].z)/(V[k+1].s-V[k].s);pf+=T(X(sm),Y(zG(sm,V))-2,1.9,`i = ${fx(ii*100,3)} %`,'text-anchor="middle" font-weight="700" fill="#0b1f3a"')}

<template id="ajudaTpl"><div id="ajuda"><h1>Aba 26 — Ajuda / Manual de Uso</h1><p class="pr">Passo a passo das Abas 01 a 25 para chegar a um resultado com êxito.</p>
<h2>Antes de começar</h2>
<div class="c"><p>Abra o <code>index.html</code> no navegador (Chrome ou Edge). Tudo roda offline e é salvo automaticamente <b>neste navegador</b>. Faça backup em <b>Aba 01 → 💾 Exportar JSON</b> com frequência.</p>
<div class="w">O aplicativo <b>não embute valores normativos</b>. Velocidade, superelevação, atrito, IDF, coeficientes de tráfego e de pavimento vêm preenchidos como <b>exemplo</b>: substitua pelos do manual do órgão (DNIT IPR 706, 719, 723, 724 etc.) e registre a fonte.</div></div>

<h2>Ordem recomendada de trabalho</h2>
<div class="c"><ol>
<li><b>Base:</b> 01 (projeto) → 06 (parâmetros) → 04 (topografia/MDT).</li>
<li><b>Planta:</b> 02 (estudo) → 07 (PIs) → 08 (curvas) → 09 (estaqueamento).</li>
<li><b>Perfil e seções:</b> 10 (terreno) → 11 (greide) → 12 (seções) → 13 (terraplenagem).</li>
<li><b>Estudos:</b> 16 (tráfego) → 05/17 (geotecnia) → 18 (pavimento); 14 (drenagem) → 15 (obras de arte).</li>
<li><b>Complementos:</b> 19 (sinalização), 20 (segurança), 21 (3D).</li>
<li><b>Fechamento:</b> 22 (auditoria) → 25 (orçamento) → 23 (pranchas) → 24 (normas).</li></ol>
<p class="pr">Dica: aprenda primeiro com <b>Carregar demonstração</b> (Aba 01). Os dados são fictícios; depois use <b>Novo projeto</b>.</p></div>

<h2>Índice</h2>
<div class="idx"><a href="javascript:void 0" onclick="ajGo('aj1')">01</a><a href="javascript:void 0" onclick="ajGo('aj2')">02</a><a href="javascript:void 0" onclick="ajGo('aj3')">03</a><a href="javascript:void 0" onclick="ajGo('aj4')">04</a><a href="javascript:void 0" onclick="ajGo('aj5')">05</a><a href="javascript:void 0" onclick="ajGo('aj6')">06</a><a href="javascript:void 0" onclick="ajGo('aj7')">07</a><a href="javascript:void 0" onclick="ajGo('aj8')">08</a><a href="javascript:void 0" onclick="ajGo('aj9')">09</a><a href="javascript:void 0" onclick="ajGo('aj10')">10</a><a href="javascript:void 0" onclick="ajGo('aj11')">11</a><a href="javascript:void 0" onclick="ajGo('aj12')">12</a><a href="javascript:void 0" onclick="ajGo('aj13')">13</a><a href="javascript:void 0" onclick="ajGo('aj14')">14</a><a href="javascript:void 0" onclick="ajGo('aj15')">15</a><a href="javascript:void 0" onclick="ajGo('aj16')">16</a><a href="javascript:void 0" onclick="ajGo('aj17')">17</a><a href="javascript:void 0" onclick="ajGo('aj18')">18</a><a href="javascript:void 0" onclick="ajGo('aj19')">19</a><a href="javascript:void 0" onclick="ajGo('aj20')">20</a><a href="javascript:void 0" onclick="ajGo('aj21')">21</a><a href="javascript:void 0" onclick="ajGo('aj22')">22</a><a href="javascript:void 0" onclick="ajGo('aj23')">23</a><a href="javascript:void 0" onclick="ajGo('aj24')">24</a><a href="javascript:void 0" onclick="ajGo('aj25')">25</a></div>

<h2>As 25 abas</h2>

<details id="aj1"><summary>Aba 01 — Início e Projeto</summary><div class="b">
<p class="pr">Objetivo: identificar o projeto e gerenciar arquivos.</p><ol>
<li>Escolha <b>Novo projeto</b> (em branco) ou <b>Carregar demonstração</b> (para treinar).</li>
<li>Preencha nome da rodovia, código, trecho, município, estado, contratante, projetista, responsável técnico, CREA e ART.</li>
<li>Defina tipo de projeto, extensão prevista, sistema de coordenadas, datum, unidade e fase.</li>
<li>Use <b>Exportar JSON</b> para backup e <b>Abrir JSON</b> para retomar. <b>Autoteste do motor</b> confere os cálculos básicos.</li></ol>
<p class="ok">Êxito: a faixa amarela “PROJETO DE DEMONSTRAÇÃO” desaparece e a Auditoria (22) não acusa “Responsável técnico/CREA/ART”.</p></div></details>

<details id="aj2"><summary>Aba 02 — Estudos Preliminares</summary><div class="b">
<p class="pr">Pré-requisito: MDT gerado (Aba 04) para ver declividades.</p><ol>
<li>Em <b>Modo de clique no mapa</b>, lance elementos de reconhecimento (curso d’água, travessia, sondagem, obra de arte, interferência) e use <b>Concluir elemento</b>.</li>
<li>Crie alternativas de traçado com <b>+ Nova alternativa</b>: informe nome, segurança (1–5) e vértices <code>E;N</code> por linha, ou clique no mapa.</li>
<li>Preencha tolerância, largura de faixa, custo por km, custo por travessia e a fonte dos custos; clique <b>Aplicar</b>.</li>
<li>Leia a <b>Matriz comparativa</b>, escolha a alternativa, escreva a justificativa e clique <b>Adotar como diretriz</b>.</li></ol>
<p class="ok">Êxito: a diretriz adotada aparece como base dos PIs na Aba 07.</p></div></details>

<details id="aj3"><summary>Aba 03 — Tráfego (resumo)</summary><div class="b">
<ol><li>Aba somente de leitura: mostra o número N e os dados principais.</li>
<li>Para alterar, clique <b>Abrir Aba 16</b>.</li></ol>
<p class="ok">Êxito: o N exibido aqui é igual ao da Aba 16.</p></div></details>

<details id="aj4"><summary>Aba 04 — Topografia / MDT</summary><div class="b">
<p class="pr">Base de tudo que usa cota: perfil, greide, seções e terraplenagem.</p><ol>
<li>Defina a <b>ordem das colunas</b> (P, E, N, Z, D) e clique <b>⬆ Importar</b> (CSV, TXT, XYZ, LandXML ou DXF). Também é possível <b>+ Ponto</b> manual.</li>
<li>Informe a <b>referência vertical</b> (datum altimétrico).</li>
<li>Ajuste aresta máxima da TIN (0 = sem limite), equidistância das curvas e tolerância de Z discrepante.</li>
<li>Clique <b>⟳ Gerar MDT / Verificar</b>.</li>
<li>Revise os <b>pontos suspeitos</b> (marque “Mostrar apenas suspeitos”) e corrija ou remova.</li></ol>
<div class="w">As linhas de quebra (talvegues, cristas) aparecem no mapa, mas <b>ainda não restringem a triangulação</b>.</div>
<p class="ok">Êxito: triângulos &gt; 0 e área da TIN coerente com o levantamento.</p></div></details>

<details id="aj5"><summary>Aba 05 — Geotecnia (furos)</summary><div class="b">
<ol><li>Informe ISC mínimo do subleito, expansão máxima e coeficiente <b>k</b> (conforme IPR 719).</li>
<li><b>➕ Adicionar furo</b>: progressiva, profundidade, HRB, LL, IP, ISC, expansão, umidade ótima e γs máx.</li>
<li>Leia a <b>Estatística do ISC</b> (ISCk = X̄ − k·σ), única para todo o trecho. <b>⬇ Exportar CSV</b> se necessário.</li></ol>
<p class="pr">Para CBR por segmento homogêneo, usado no pavimento, use a Aba 17.</p>
<p class="ok">Êxito: cada furo com situação “Conforme” ou justificativa de substituição.</p></div></details>

<details id="aj6"><summary>Aba 06 — Parâmetros de Projeto</summary><div class="b">
<p class="pr">É a aba mais importante: alimenta 08, 11, 12, 13, 20 e 22.</p><ol>
<li>Preencha <b>V</b>, superelevação máx. <b>e</b>, atrito <b>f</b>, rampa máx. <b>i</b> e a <b>fonte/documento</b> dos parâmetros (obrigatória na Auditoria). O raio mínimo é calculado.</li>
<li>Seção: intervalo de estaca, progressiva inicial, declividade transversal, nº de faixas, largura da faixa e distribuição da superelevação.</li>
<li>Transição: rampa relativa de bordo, taxa J, tempo mínimo na espiral, superlargura (distância entre eixos, arredondamento).</li>
<li>Greide e visibilidade: rampa mínima, tempos, atrito longitudinal, alturas h1/h2, faróis, K mínimos, fator c (L ≥ c·V).</li>
<li>Seção-tipo: acostamento, espessura do pavimento, taludes de corte e aterro, fator Fh e passos de busca do off-set.</li></ol>
<p class="ok">Êxito: nenhum campo vazio nos grupos usados; DVP e Rmín exibidos.</p></div></details>

<details id="aj7"><summary>Aba 07 — Traçado em Planta</summary><div class="b">
<p class="pr">Pré-requisito: Aba 06. Mínimo de 2 vértices (início e fim).</p><ol>
<li>Ative as camadas desejadas (curvas de nível, reconhecimento).</li>
<li>Use <b>✏ Lançar PI por clique</b> ou <b>+ PI por coordenadas</b>. A diretriz adotada na Aba 02 pode ser o ponto de partida.</li>
<li>Na tabela, confira E, N e <b>informe o raio R</b> de cada PI intermediário.</li>
<li>Confira azimutes e distâncias entre PIs; <b>⤢ Ajustar vista</b> enquadra o traçado.</li></ol>
<p class="ok">Êxito: eixo contínuo, sem PIs sobrepostos.</p></div></details>

<details id="aj8"><summary>Aba 08 — Curvas Horizontais</summary><div class="b">
<ol><li>Para cada PI, defina <b>R</b>, <b>Ls</b> (comprimento da espiral; 0 = circular simples), lado e superelevação manual se desejar.</li>
<li>Confira AC, θs, Dc, tangentes e as estacas de locação (TS, SC, CS, ST).</li>
<li>Verifique se <b>R ≥ Rmín</b> e se as curvas não se sobrepõem (tangente entre curvas suficiente).</li>
<li>Veja os diagramas de superelevação e superlargura.</li></ol>
<p class="ok">Êxito: todos os raios “Conforme” e geometria do eixo sem erro na Auditoria.</p></div></details>

<details id="aj9"><summary>Aba 09 — Estaqueamento</summary><div class="b">
<ol><li>Confira a tabela de estaca, progressiva, E, N, cota do terreno, azimute e curvatura.</li>
<li>Se o intervalo estiver errado, altere na Aba 06.</li>
<li><b>⬇ Exportar CSV</b> para locação em campo.</li></ol>
<p class="ok">Êxito: cotas preenchidas em todas as estacas (dependem do MDT).</p></div></details>

<details id="aj10"><summary>Aba 10 — Perfil do Terreno</summary><div class="b">
<ol><li>Escolha escalas horizontal e vertical.</li>
<li>Cadastre interferências com <b>+ Interferência manual</b>, se houver.</li>
<li>Confira as cotas por estaca e <b>⬇ Exportar CSV</b>.</li></ol>
<p class="ok">Êxito: perfil contínuo. Trechos fora do MDT ficam interrompidos; amplie o levantamento na Aba 04.</p></div></details>

<details id="aj11"><summary>Aba 11 — Greide</summary><div class="b">
<p class="pr">Pré-requisito: perfil do terreno (Aba 10).</p><ol>
<li>Use <b>Sugestão pelo terreno</b> como ponto de partida ou <b>+ PIV</b> manual (progressiva, cota e comprimento da curva L).</li>
<li>Ajuste PIVs até que as <b>rampas</b> fiquem ≤ i máx. e ≥ rampa mínima.</li>
<li>Nas <b>curvas verticais</b>, confira K, L e flecha contra o K mínimo e a visibilidade.</li>
<li>Releia as <b>Verificações gerais</b> e <b>⬇ Exportar CSV</b>.</li></ol>
<p class="ok">Êxito: todas as verificações “Conforme”. “Não verificado” indica parâmetro faltando na Aba 06.</p></div></details>

<details id="aj12"><summary>Aba 12 — Seções Transversais</summary><div class="b">
<p class="pr">Pré-requisitos: MDT (04), parâmetros (06) e greide (11).</p><ol>
<li>Navegue com <b>◀ ▶</b> ou escolha a seção exibida.</li>
<li>Confira plataforma, taludes, <b>off-sets</b> e áreas de corte e aterro.</li>
<li>Consulte o resumo; se o terreno estiver pouco detalhado, reduza o passo transversal na Aba 06.</li>
<li><b>⬇ Notas de serviço (CSV)</b>.</li></ol>
<p class="ok">Êxito: todas as seções válidas (ex.: 121 de 121) na Auditoria.</p></div></details>

<details id="aj13"><summary>Aba 13 — Terraplenagem</summary><div class="b">
<ol><li>Confira volumes de corte, aterro compactado e aterro × Fh (fator definido na Aba 06).</li>
<li>Analise o <b>Diagrama de Brückner</b>: ramo ascendente = corte, descendente = aterro.</li>
<li>Defina a <b>ordenada da linha de compensação</b> e leia volumes, momentos e DMT por onda.</li>
<li><b>⬇ Exportar CSV</b>.</li></ol>
<div class="w">Escolha da linha, distância econômica de transporte, bota-fora e empréstimo são <b>decisões do engenheiro</b>.</div></div></details>

<details id="aj14"><summary>Aba 14 — Drenagem</summary><div class="b">
<ol><li>Informe a equação IDF (K, a, b, c) <b>oficial da região</b> e a fonte; a que vem preenchida é fictícia.</li>
<li>Defina TR de sarjetas, bueiros e pontes, área máx. do método racional, tempo de concentração e coeficiente C.</li>
<li>Sarjeta triangular: largura de contribuição, taludes z₁ e z₂, lâmina máx., Manning n e velocidades mín./máx.</li>
<li>Confira o comprimento crítico por rampa; onde o trecho for inadequado, preveja saída d’água ou reduza o espaçamento.</li></ol>
<p class="ok">Êxito: situação “Conforme”. “Conforme c/ ressalva” exige leitura das observações.</p></div></details>

<details id="aj15"><summary>Aba 15 — Obras de Arte</summary><div class="b">
<p class="pr">Pré-requisito: elementos “Curso d’água/Travessia” lançados na Aba 02 e IDF da Aba 14.</p><ol>
<li>Ajuste lâmina máx. y/D, recobrimento mínimo, espessura do tubo e borda livre de pontes.</li>
<li>Clique <b>⚙ Gerar a partir das travessias do eixo</b> ou use <b>+ Obra manual</b>.</li>
<li>Confira vazão (racional, tc de Kirpich) e a obra sugerida; <b>⬇ Exportar CSV</b>.</li></ol>
<p class="ok">Êxito: cada travessia com obra e verificação hidráulica atendida.</p></div></details>

<details id="aj16"><summary>Aba 16 — Estudo de Tráfego (N)</summary><div class="b">
<ol><li>Informe taxa de crescimento, modelo (Geométrico/Linear), período, fatores direcional, de faixa e climático FR.</li>
<li>Em <b>+ Classe</b>, cadastre nome, VMD e eixos no formato <code>tipo:carga</code>, ex.: <code>ES:6;ETD:17</code> (ES simples, ETD tandem duplo, ETT tandem triplo; carga em tf).</li>
<li>Confira os coeficientes FEC com o manual do DNIT (IPR 723).</li>
<li>Leia o resultado: Σ(VMD·FV), Sp e <b>N</b>.</li></ol>
<p class="ok">Êxito: nenhuma classe “inválido” e N calculado.</p></div></details>

<details id="aj17"><summary>Aba 17 — Geotecnia do Subleito</summary><div class="b">
<ol><li>Escolha o critério (Estatístico, Mínimo ou Média) e preencha k₁, k₂, nº mínimo de amostras e expansão máxima.</li>
<li>Em <b>+ Amostra</b>, informe progressiva, ISC e expansão.</li>
<li>Defina as <b>quebras dos segmentos homogêneos</b> (progressivas separadas por <code>;</code>).</li>
<li>Leia, por segmento, n, média, desvio e o <b>CBR de projeto</b>.</li></ol>
<p class="ok">Êxito: cada segmento com amostras suficientes e CBR de projeto &gt; 0.</p></div></details>

<details id="aj18"><summary>Aba 18 — Pavimentação</summary><div class="b">
<p class="pr">Pré-requisitos: N (16), CBR por segmento (17) e eixo definido (07).</p><ol>
<li>Confira o revestimento sugerido para o N; opcionalmente informe a espessura adotada.</li>
<li>Preencha os coeficientes K e as propriedades da base, sub-base e reforço (CBR e expansão), com seus limites.</li>
<li>Leia as espessuras por segmento e a verificação das equivalências.</li></ol>
<div class="w">Tabelas e coeficientes são de exemplo; confira no IPR 719. Não há análise mecanística (MeDiNa).</div></div></details>

<details id="aj19"><summary>Aba 19 — Sinalização</summary><div class="b">
<ol><li>Defina raio-limite de “curva acentuada” e distância da placa antes da curva.</li>
<li>Informe larguras das linhas de bordo e de eixo, relação traço/espaço e espaçamento de tachas.</li>
<li>Confira a lista de placas gerada (A-1, A-2, R-19, R-7) e os quantitativos horizontais; <b>⬇ Exportar CSV</b>.</li></ol>
<p class="pr">Complemente manualmente: delineadores, interseções, placas indicativas e de obras de arte.</p></div></details>

<details id="aj20"><summary>Aba 20 — Segurança Viária</summary><div class="b">
<ol><li>Informe V, tempo de percepção e reação, atrito f, alturas h₁, h₂, h₃, distância de ultrapassagem, afastamento lateral M, alcance e passo da visada.</li>
<li>Leia a <b>visibilidade de parada</b> (Dp requerida × disponível), as <b>zonas de proibição de ultrapassagem</b> e os aterros para contenção.</li>
<li>Trate os pontos “Não conforme”; “(fim)” indica visada limitada pelo final do trecho.</li></ol>
<p class="ok">Êxito: sem trechos “Dados insuficientes”.</p></div></details>

<details id="aj21"><summary>Aba 21 — Modelo 3D</summary><div class="b">
<p class="pr">Pré-requisito: seções válidas (Aba 12).</p><ol>
<li>Ajuste exagero vertical, faixa de terreno, subdivisões transversais e exibição do MDT.</li>
<li>Gire e dê zoom; use <b>Vista padrão</b> ou <b>Planta</b>.</li>
<li>Exporte em <b>OBJ</b> ou <b>IFC4</b>. <b>Autoteste 3D</b> valida o modelo.</li></ol>
<p class="ok">Êxito: “seções com erro” = 0.</p></div></details>

<details id="aj22"><summary>Aba 22 — Auditoria</summary><div class="b">
<ol><li>Leia os contadores: conformes, não conformes, dados insuficientes e a verificar.</li>
<li>Corrija cada “Não conforme” e preencha os “Dados insuficientes” na aba indicada.</li>
<li>Itens “Verificar” (drenagem, pavimento, sinalização, revisão) dependem de conferência do responsável técnico.</li>
<li><b>⬇ Exportar CSV</b> do relatório.</li></ol>
<p class="ok">Êxito: nenhum “Não conforme”. A auditoria não substitui a verificação normativa.</p></div></details>

<details id="aj23"><summary>Aba 23 — Pranchas / Documentação</summary><div class="b">
<ol><li>Escolha o tipo: <b>Seções transversais</b> ou <b>Planta e Perfil</b>.</li>
<li>Defina formato, escala, progressivas inicial e final, “1 a cada N seções” e título.</li>
<li>Navegue pelas folhas com <b>◀ ▶</b>.</li>
<li><b>🖨 Imprimir / PDF</b>: permita pop-ups, escolha “Salvar como PDF”, tamanho do formato, margens “Nenhuma”, escala 100%. Também há <b>SVG da folha</b> e <b>CSV de áreas</b>.</li></ol></div></details>

<details id="aj24"><summary>Aba 24 — Configurações / Normas</summary><div class="b">
<ol><li>Com <b>+ Documento</b>, registre cada norma, manual ou termo de referência adotado, com edição/ano e aplicação.</li>
<li>Consulte o espaço usado no navegador.</li>
<li><b>Apagar dados locais</b> remove o projeto salvo: exporte o JSON antes.</li></ol></div></details>

<details id="aj25"><summary>Aba 25 — Orçamento e Quantitativos</summary><div class="b">
<p class="pr">Pré-requisito: terraplenagem (13) e demais abas concluídas.</p><ol>
<li>Confira os <b>quantitativos automáticos</b> (excedente e empréstimo são simplificados, sem distância de transporte).</li>
<li>Informe a fonte dos preços (ex.: SICRO e data-base) e o BDI.</li>
<li>Use <b>+ Item</b> para cada serviço: descrição, unidade, origem da quantidade e preço unitário real.</li>
<li><b>⬇ CSV</b> ou <b>🖨 Imprimir / PDF</b>.</li></ol>
<div class="w">O aplicativo <b>não traz preços</b>: todos devem ser digitados da fonte adotada.</div></div></details>

<h2>Checklist final</h2>
<div class="c"><ol>
<li>Aba 06 com valores oficiais e fonte registrada.</li>
<li>MDT gerado e pontos suspeitos tratados (04).</li>
<li>Raios ≥ Rmín (08) e greide “Conforme” (11).</li>

<div id="apvLock" style="display:flex;position:fixed;inset:0;background:#0b1f3a;z-index:99999;align-items:center;justify-content:center;font-family:Segoe UI,Arial">
  <div style="background:#fff;color:#1b2a41;padding:28px;border-radius:10px;max-width:460px;width:90%">
    <h2 style="margin-top:0;color:#0b1f3a">APavan Engenharia e Consultoria</h2>
    <p id="apvMsg">Verificando licença...</p>
    <textarea id="apvKey" rows="4" placeholder="Cole aqui a chave de licença" style="width:100%;box-sizing:border-box;font-family:monospace"></textarea>
    <button id="apvBtn" style="margin-top:10px;background:#0b1f3a;color:#fff;border:0;padding:10px 16px;border-radius:6px;cursor:pointer">Ativar</button>

<script>
(()=>{
  const APP='APAVAN-ESTRUTURAL';          // mesmo código usado no gerador
  const PUB={"crv":"P-256","ext":true,"key_ops":["verify"],"kty":"EC","x":"MxcnCCjYM-jLqmqE_7ffBXk52xgGKmxfvUFwss1wnT4","y":"a_hUBmjn7eDohnxkdoZg0VMpkZWjJ6hYBWDGceAcd9k"};
  const dec=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  const lock=document.getElementById('apvLock'), msg=document.getElementById('apvMsg');
  const hojeISO=()=>new Date().toISOString().slice(0,10);

  async function verificar(k){
    const [p,s]=k.trim().split('.'); if(!s) throw 'Chave mal formatada.';
    const key=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const data=dec(p);
    if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,dec(s),data)) throw 'Chave inválida.';
    const L=JSON.parse(new TextDecoder().decode(data));
    if(L.a!==APP) throw 'Chave pertence a outro aplicativo.';
    const ult=localStorage.getItem('apv_ult')||'';
    if(ult && hojeISO()<ult) throw 'Data do sistema foi retrocedida. Corrija o relógio.';
    if(hojeISO()>L.e) throw 'Licença expirada em '+L.e.split('-').reverse().join('/')+'.';
    localStorage.setItem('apv_ult',hojeISO());
    return L;
  }
  function bloquear(t){msg.textContent=t; lock.style.display='flex';}
  async function iniciar(){
    const k=localStorage.getItem('apv_lic');
    if(!k) return bloquear('Informe a chave de licença.');
    try{
      const L=await verificar(k);
      lock.style.display='none';
      const r=Math.ceil((new Date(L.e)-new Date(hojeISO()))/864e5);
      if(r<=7) alert('Licença de '+L.c+' expira em '+r+' dia(s). Contate a APavan.');
    }catch(e){bloquear(e)}
  }
  document.getElementById('apvBtn').onclick=async()=>{
    const k=document.getElementById('apvKey').value;
    try{await verificar(k); localStorage.setItem('apv_lic',k.trim()); iniciar();}
    catch(e){msg.textContent=e}
  };
  iniciar(); setInterval(iniciar,36e5);   // reverifica a cada 1 h
})();
</script>
